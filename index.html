<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จับคู่ 10 ด่าน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap">
<style>
:root{--bg:#eae6f7;--ink:#241c3d;--muted:#5e5580;--face:#fffdfa;--line:#c9c0e6;--back:#2a2160;--star:#f5e6a8;--ok:#1f8f63;--bad:#c23b4e;--btn:#2a2160;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0a22;--ink:#f1ecff;--muted:#a79ed0;--face:#1c1640;--line:#3a2f73;--back:#17114a;--ok:#5fd3a0;--bad:#ff7a8b;--btn:#f5e6a8}}
:root[data-theme="dark"]{--bg:#0e0a22;--ink:#f1ecff;--muted:#a79ed0;--face:#1c1640;--line:#3a2f73;--back:#17114a;--ok:#5fd3a0;--bad:#ff7a8b;--btn:#f5e6a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center;padding:20px 12px}
main{width:100%;max-width:460px;text-align:center}
h1{font-size:1.6rem;margin:4px 0 2px;font-weight:600}h2{font-size:1.2rem;margin:6px 0}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem;line-height:1.5}
[hidden]{display:none!important}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--face);border:1.5px solid var(--line);border-radius:14px;padding:8px 2px}
.stat b{display:block;font-size:1.15rem;min-height:1.6rem}.stat span{font-size:.75rem;color:var(--muted)}
.stat.low b{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width 1s linear}.bar.low i{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 16px}
.chip{background:var(--face);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem}
.grid{display:grid;gap:7px}
.card{aspect-ratio:1;perspective:600px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.b{background:repeating-linear-gradient(45deg,var(--back) 0 8px,var(--line) 8px 10px);border:2px solid var(--line)}
.card.fog .b{background:linear-gradient(135deg,#8c86b3,#c9c5e0);border-style:dashed}
.f{background:var(--face);border:2px solid var(--line);transform:rotateY(180deg);font-size:var(--fs,2rem)}
.card.done .f{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.card.curse.done .f{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset}
.card.miss .f{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset}
.card.fog.open .f span{animation:clr 1.1s forwards}
@keyframes clr{from{filter:blur(9px)}to{filter:blur(0)}}
#msg{min-height:2.6em;margin-top:12px;font-weight:600;line-height:1.4}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
button.main{margin:10px 4px 0;padding:12px 26px;border:0;border-radius:999px;background:var(--btn);color:var(--bg);font:600 1rem "Prompt",sans-serif;cursor:pointer}
button.main:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
input{width:100%;max-width:300px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--face);color:var(--ink);font:1rem "Prompt",sans-serif;text-align:center}
.note{font-size:.8rem;color:var(--muted);margin:8px 0}
#lb{margin-top:26px;background:var(--face);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
#lb h2{text-align:center}
#lb ol{margin:6px 0 0;padding:0;list-style:none}
#lb li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
#lb li:first-child{border-top:0}#lb li.me{color:var(--ok);font-weight:600}
#lb .r{width:1.6rem;color:var(--muted)}#lb .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lb .s{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.in{transition:none}.bar i{transition:none}.card.fog.open .f span{animation:none}}
</style>
</head>
<body>
<main>
  <section id="home">
    <h1>จับคู่ 10 ด่าน</h1>
    <p class="sub">ผ่านด่านให้ได้มากที่สุดเพื่อขึ้นกระดานอันดับ ยิ่งเหลือเวลาและหัวใจมาก คะแนนยิ่งสูง</p>
    <input id="name" maxlength="16" placeholder="ใส่ชื่อผู้เล่น" aria-label="ชื่อผู้เล่น" autocomplete="off">
    <p class="note">ชื่อจะแสดงให้ผู้เล่นคนอื่นเห็น อย่าใส่ข้อมูลส่วนตัว</p>
    <button class="main" id="go">เริ่มเกม</button>
  </section>

  <section id="intro" hidden>
    <h1 id="ilv"></h1><h2 id="iname"></h2>
    <div class="chips" id="chips"></div>
    <button class="main" id="begin">เริ่มด่านนี้</button>
  </section>

  <section id="play" hidden>
    <h2 id="plv"></h2>
    <div id="hud">
      <div class="stats">
        <div class="stat" id="tstat"><b id="time"></b><span>วินาที</span></div>
        <div class="stat"><b id="hearts"></b><span>หัวใจ</span></div>
        <div class="stat"><b id="pairs"></b><span>จับคู่แล้ว</span></div>
      </div>
      <div class="bar" id="bar"><i id="fill"></i></div>
    </div>
    <div class="grid" id="grid" role="group" aria-label="กระดานไพ่"></div>
    <div id="msg" aria-live="polite"></div>
  </section>

  <section id="result" hidden>
    <h1 id="rt"></h1>
    <p class="sub" id="rs"></p>
    <button class="main" id="next">ด่านต่อไป</button>
    <button class="main" id="again">เริ่มใหม่ตั้งแต่ด่าน 1</button>
  </section>

  <section id="lb" aria-label="กระดานอันดับ">
    <h2>กระดานอันดับ</h2>
    <p class="note" id="lbnote" style="text-align:center">กำลังโหลด...</p>
    <ol id="lbl"></ol>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const POOL=["🐱","🐶","🦊","🐼","🐸","🐙","🦋","🐢","🍎","🍉","🍇","🍋","🚀","🎈","🎲","🔔","🌵","⚽"],DECOY=["🐭","🍏","🎯"];
const LV=[
 {n:"อุ่นเครื่อง",p:6,t:0,h:0,flash:5},
 {n:"นาฬิกาเดิน",p:8,t:80,h:0},
 {n:"หัวใจ 5 ดวง",p:10,t:90,h:5},
 {n:"ไพ่ลวง",p:9,d:2,t:90,h:5},
 {n:"บอส: เวลาบีบ",p:12,t:60,h:3,boss:1},
 {n:"หมอกหนา",p:12,t:90,h:4,fog:6},
 {n:"ไพ่คำสาป",p:14,c:2,t:100,h:4},
 {n:"มืดบอด",p:15,t:100,h:4,blind:1},
 {n:"ทุกอย่างรวมกัน",p:17,d:2,t:110,h:4,fog:6,flash:3},
 {n:"บอสสุดท้าย: ด่านมหาโหด",p:17,c:2,t:45,h:2,fog:6,flash:4,boss:1}
];
let name="",lv=0,run=0,cleared=0,L,hearts,left,matched,first,lock,timer,started,over;
let db=null,uid=null;

function getName(){try{return localStorage.getItem("moon-name")||""}catch(e){return ""}}
function saveName(v){try{localStorage.setItem("moon-name",v)}catch(e){}}
function show(id){["home","intro","play","result"].forEach(s=>$(s).hidden=s!==id)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t,c){$("msg").textContent=t;$("msg").className=c||""}

/* ---------- leaderboard ---------- */
function renderLb(docs){
  const ol=$("lbl");ol.innerHTML="";
  $("lbnote").textContent=docs.length?"":"ยังไม่มีใครบันทึกคะแนน เป็นคนแรกเลย";
  docs.forEach((d,i)=>{
    const v=d.data()||{},li=document.createElement("li");
    if(d.id===uid)li.className="me";
    const r=document.createElement("span"),n=document.createElement("span"),s=document.createElement("span");
    r.className="r";r.textContent=i+1;n.className="n";n.textContent=String(v.name||"ไม่ระบุชื่อ").slice(0,16);
    s.className="s";s.textContent=(v.score||0)+" แต้ม · ด่าน "+(v.level||0);
    li.append(r,n,s);ol.appendChild(li);
  });
}
async function initDb(){
  try{
    if(typeof claude==="undefined")throw 0;
    const u=await claude.use("user"),d=await claude.use("db");
    if(!u||!d)throw 0;
    uid=String(await u.id());db=d;
    const t=setTimeout(()=>{$("lbnote").textContent="โหลดกระดานอันดับไม่สำเร็จ"},10000);
    db.collection("scores").orderBy("score","desc").limit(10).onSnapshot(s=>{clearTimeout(t);renderLb(s.docs)},()=>{clearTimeout(t);$("lbnote").textContent="โหลดกระดานอันดับไม่สำเร็จ"});
  }catch(e){$("lbnote").textContent="กระดานอันดับใช้ได้เมื่อล็อกอิน claude.ai และได้รับสิทธิ์เข้าร่วม แต่ยังเล่นเกมได้ตามปกติ"}
}
async function submit(){
  if(!db||!uid||run<=0)return;
  try{
    const ref=db.doc("scores/"+uid),s=await ref.get(),old=s.exists?(s.data().score||0):0;
    if(run>old)await ref.set({name,score:run,level:cleared,at:Date.now()});
    else if(s.exists&&s.data().name!==name)await ref.update({name});
  }catch(e){$("lbnote").textContent="บันทึกคะแนนไม่สำเร็จ"}
}

/* ---------- game ---------- */
function chipsFor(c){
  const a=[c.p*2+(c.d||0)+(c.c||0)+" ใบ",c.t?"เวลา "+c.t+" วินาที":"ไม่จำกัดเวลา",c.h?"หัวใจ "+c.h+" ดวง":"ไม่มีหัวใจ (ผิดเสีย 3 วินาที)"];
  if(c.flash)a.push("ดูไพ่ "+c.flash+" วินาที แล้วคว่ำ");
  if(c.d)a.push("ไพ่ลวง "+c.d+" ใบไม่มีคู่");
  if(c.fog)a.push("หมอกบังไพ่ "+c.fog+" ใบ");
  if(c.c)a.push("ไพ่คำสาป "+c.c+" ใบ");
  if(c.blind)a.push("ซ่อนเวลาและหัวใจ");
  return a;
}
function intro(){
  L=LV[lv];
  $("ilv").textContent=(L.boss?"👑 ":"")+"ด่าน "+(lv+1)+" จาก "+LV.length;
  $("iname").textContent=L.n;
  const box=$("chips");box.innerHTML="";
  chipsFor(L).forEach(t=>{const s=document.createElement("span");s.className="chip";s.textContent=t;box.appendChild(s)});
  show("intro");
}
function paint(){
  $("time").textContent=L.t?Math.max(0,left):"∞";
  $("hearts").textContent=L.h?"❤️".repeat(Math.max(0,hearts)):"-";
  $("pairs").textContent=matched+"/"+L.p;
  const low=L.t&&left<=15;
  $("tstat").classList.toggle("low",!!low);$("bar").classList.toggle("low",!!low);
  $("fill").style.width=L.t?Math.max(0,left/L.t*100)+"%":"100%";
}
function build(){
  const faces=shuffle([...POOL]).slice(0,L.p),list=[];
  faces.forEach(f=>list.push({k:f,f},{k:f,f}));
  for(let i=0;i<(L.d||0);i++)list.push({k:"decoy"+i,f:DECOY[i%DECOY.length]});
  for(let i=0;i<(L.c||0);i++)list.push({k:"curse",f:"💀",curse:1});
  shuffle(list);
  const n=list.length,cols=n<=16?4:n<=20?5:6;
  const g=$("grid");g.innerHTML="";
  g.style.gridTemplateColumns="repeat("+cols+",1fr)";
  g.style.setProperty("--fs",(cols===6?1.6:cols===5?1.9:2.2)+"rem");
  list.forEach(o=>{
    const c=document.createElement("button");
    c.className="card"+(o.curse?" curse":"");c.dataset.k=o.k;c.setAttribute("aria-label","ไพ่ปิดอยู่");
    c.innerHTML='<div class="in"><div class="b"></div><div class="f"><span>'+o.f+'</span></div></div>';
    c.addEventListener("click",()=>flip(c));g.appendChild(c);
  });
  if(L.fog){
    const ok=[...g.children].filter(c=>c.dataset.k!=="curse");
    shuffle(ok).slice(0,L.fog).forEach(c=>c.classList.add("fog"));
  }
}
function begin(){
  clearInterval(timer);first=null;started=false;over=false;matched=0;left=L.t;hearts=L.h;
  $("plv").textContent=(L.boss?"👑 ":"")+"ด่าน "+(lv+1)+": "+L.n;
  $("hud").hidden=!!L.blind;
  say(L.blind?"🙈 ข้อมูลถูกซ่อนไว้ ใช้ความจำและความรู้สึกของคุณ":"");
  build();paint();show("play");
  const cards=[...$("grid").children];
  if(L.flash){
    lock=true;cards.forEach(c=>c.classList.add("open"));
    let s=L.flash;say("จำให้ดี! ไพ่จะคว่ำใน "+s+" วินาที");
    const fl=setInterval(()=>{
      s--;
      if(s>0)say("จำให้ดี! ไพ่จะคว่ำใน "+s+" วินาที");
      else{clearInterval(fl);cards.forEach(c=>c.classList.remove("open"));lock=false;say("เริ่มได้เลย")}
    },1000);
  }else lock=false;
}
function tick(){left--;paint();if(left<=0)fail("หมดเวลา")}
function hurt(){
  if(L.h){hearts--;paint();if(hearts<=0){fail("หัวใจหมด");return true}}
  else if(L.t){left-=3;paint();if(left<=0){fail("หมดเวลา");return true}}
  return false;
}
function flip(c){
  if(lock||over||c.classList.contains("open")||c.classList.contains("done"))return;
  if(!started){started=true;if(L.t)timer=setInterval(tick,1000)}
  c.classList.add("open");c.setAttribute("aria-label","ไพ่เปิดอยู่");
  if(c.dataset.k==="curse")return curse(c);
  if(!first){first=c;return}
  const a=first,b=c;first=null;
  if(a.dataset.k===b.dataset.k){
    [a,b].forEach(x=>{x.classList.remove("open");x.classList.add("done")});
    matched++;paint();say("");
    if(matched===L.p)clear();
    return;
  }
  lock=true;[a,b].forEach(x=>x.classList.add("miss"));say("ผิด!","bad");
  if(hurt())return;
  setTimeout(()=>{
    [a,b].forEach(x=>{x.classList.remove("open","miss");x.setAttribute("aria-label","ไพ่ปิดอยู่")});
    if(!over){lock=false;say("")}
  },(a.classList.contains("fog")||b.classList.contains("fog"))?1100:800);
}
function curse(c){
  lock=true;const e=Math.floor(Math.random()*3);
  let hold=900;
  if(e===0){say("คำสาป! เสียหัวใจ 1 ดวง","bad");if(L.h){hearts--;paint();if(hearts<=0){return fail("หัวใจหมด")}}else{left-=5;paint()}}
  else if(e===1){say("คำสาป! เสียเวลา 5 วินาที","bad");left-=5;paint();if(L.t&&left<=0)return fail("หมดเวลา")}
  else{say("คำสาป! กระดานถูกล็อก 2 วินาที","bad");hold=2000}
  setTimeout(()=>{c.classList.remove("open");c.classList.add("done");if(!over){lock=false;say("")}},hold);
}
function clear(){
  clearInterval(timer);over=true;lock=true;cleared=lv+1;
  const gain=(lv+1)*100+(L.t?Math.max(0,left)*3:0)+(L.h?Math.max(0,hearts)*30:0);
  run+=gain;
  const last=lv===LV.length-1;
  $("rt").textContent=last?"🏆 ผ่านครบทุกด่าน!":"ผ่านด่าน "+(lv+1)+"!";
  $("rs").textContent="ได้ "+gain+" แต้ม รวม "+run+" แต้ม";
  $("next").hidden=last;
  show("result");
  if(last)submit();else submit();
}
function fail(why){
  clearInterval(timer);over=true;lock=true;
  $("rt").textContent=why+" จบเกม";
  $("rs").textContent=name+" ผ่านไป "+cleared+" ด่าน รวม "+run+" แต้ม";
  $("next").hidden=true;
  show("result");submit();
}
function newRun(){lv=0;run=0;cleared=0;intro()}

$("name").value=getName();
$("go").onclick=()=>{
  const v=$("name").value.trim().slice(0,16);
  if(!v){$("name").focus();$("name").placeholder="กรุณาใส่ชื่อก่อนเริ่ม";return}
  name=v;saveName(v);newRun();
};
$("begin").onclick=begin;
$("next").onclick=()=>{lv++;intro()};
$("again").onclick=newRun;
initDb();
</script>
</body>
</html>
